name: CodeQL

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  schedule:
    - cron: "0 3 * * 1"

jobs:
  analyze:
    name: Analyze Java/Kotlin Code
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language:
          - java-kotlin

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Configure Android SDK and licenses
        run: |
          yes | sdkmanager --licenses || true
          echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Configure Firebase Credentials (google-services.json)
        run: |
          if [ ! -f "app/google-services.json" ]; then
            if [ -n "${{ secrets.GOOGLE_SERVICES_JSON }}" ]; then
              echo "Injecting google-services.json from GitHub secret GOOGLE_SERVICES_JSON"
              mkdir -p app
              echo "${{ secrets.GOOGLE_SERVICES_JSON }}" > app/google-services.json
            else
              echo "::warning::GOOGLE_SERVICES_JSON secret not found. Generating minimal CI build configuration."
              mkdir -p app
              cat << 'EOF' > app/google-services.json
          {
            "project_info": {
              "project_number": "751969067558",
              "project_id": "gen-lang-client-0915184420",
              "storage_bucket": "gen-lang-client-0915184420.firebasestorage.app"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:751969067558:android:70c0d35474d5d37ebf7ce7",
                  "android_client_info": {
                    "package_name": "com.aistudio.bcatuition.mopkby"
                  }
                },
                "oauth_client": [
                  {
                    "client_id": "751969067558-srjngcsgft8s1d2071fi3mblfa1alfl4.apps.googleusercontent.com",
                    "client_type": 3
                  }
                ],
                "api_key": [
                  {
                    "current_key": "AIzaSyCVPkb58ZC3T2iddzEarErSX0gqLY9uRH0"
                  }
                ]
              }
            ],
            "configuration_version": "1"
          }
          EOF
            fi
          fi

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          build-mode: manual
          queries: security-extended,security-and-quality

      - name: Build Android project
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon --stacktrace :app:assembleDebug

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{ matrix.language }}"