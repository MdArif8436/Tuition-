name: Build Android APK & AAB

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build Type (Debug APK / Release Bundle)'
        required: true
        default: 'both'
        type: choice
        options:
          - 'both'
          - 'debug-apk'
          - 'release-bundle'

jobs:
  build:
    name: Assemble Android Artifacts
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK Licenses
        run: |
          yes | sdkmanager --licenses || true
          echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Inject Firebase Configuration
        run: |
          if [ ! -f "app/google-services.json" ]; then
            if [ -n "${{ secrets.GOOGLE_SERVICES_JSON }}" ]; then
              echo "Injecting google-services.json from GitHub Secret..."
              mkdir -p app
              echo "${{ secrets.GOOGLE_SERVICES_JSON }}" > app/google-services.json
            else
              echo "::warning::GOOGLE_SERVICES_JSON secret not found. Using CI placeholder credentials."
              mkdir -p app
              cat << 'EOF' > app/google-services.json
          {
            "project_info": {
              "project_number": "751969067558",
              "project_id": "gen-lang-client-0915184420",
              "storage_bucket": "gen-lang-client-0915184420.firebasestorage.app"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:751969067558:android:70c0d35474d5d37ebf7ce7",
                  "android_client_info": {
                    "package_name": "com.aistudio.bcatuition.mopkby"
                  }
                },
                "oauth_client": [
                  {
                    "client_id": "751969067558-srjngcsgft8s1d2071fi3mblfa1alfl4.apps.googleusercontent.com",
                    "client_type": 3
                  }
                ],
                "api_key": [
                  {
                    "current_key": "AIzaSyCVPkb58ZC3T2iddzEarErSX0gqLY9uRH0"
                  }
                ]
              }
            ],
            "configuration_version": "1"
          }
          EOF
            fi
          fi

      - name: Make Gradle Wrapper Executable
        run: chmod +x ./gradlew

      - name: Run Unit Tests
        run: ./gradlew testDebugUnitTest --no-daemon --stacktrace

      - name: Build Debug APK
        if: ${{ inputs.build_type != 'release-bundle' }}
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Upload Debug APK Artifact
        if: ${{ inputs.build_type != 'release-bundle' }}
        uses: actions/upload-artifact@v4
        with:
          name: TuitionApp-Debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14

      - name: Build Release Bundle (AAB)
        if: ${{ inputs.build_type == 'both' || inputs.build_type == 'release-bundle' }}
        run: |
          ./gradlew :app:bundleRelease --no-daemon --stacktrace || echo "Release signing not configured; skipping bundleRelease"

      - name: Upload Release AAB Artifact
        if: ${{ inputs.build_type == 'both' || inputs.build_type == 'release-bundle' }}
        uses: actions/upload-artifact@v4
        with:
          name: TuitionApp-Release-AAB
          path: app/build/outputs/bundle/release/*.aab
          if-no-files-found: warn
          retention-days: 14

      - name: Upload Build Logs on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-failure-logs
          path: |
            app/build/reports/
            /tmp/*.log
          retention-days: 7
